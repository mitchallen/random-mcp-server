version: 2
# Keeps the image and its dependencies patched automatically. This is the
# "stay up to date" half of vulnerability management — image-scan.yml detects
# vulns, Dependabot opens the PRs that fix them. Low-risk updates
# (github-actions; docker/Python minor+patch) are auto-merged once CI passes —
# see .github/workflows/dependabot-auto-merge.yml.
#
# Noise control: each ecosystem batches its minor+patch bumps into one grouped
# PR, and `cooldown` skips releases younger than 7 days, so fast-moving deps
# land as one bump to the latest instead of a PR per release. Majors are
# deliberately left out of the groups so they still arrive as individual PRs,
# which auto-merge still leaves for review on the non-Actions ecosystems
# (fetch-metadata reports a grouped PR's highest update-type). Cooldown does not
# delay security updates.
updates:
  # Base images in the Dockerfile (cgr.dev/chainguard/python runtime + -dev builder).
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      docker-minor-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "docker"

  # GitHub Actions used by the workflows (incl. the trivy-action pin).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "ci"

  # Python dependencies (pyproject.toml / uv.lock). This must be `uv`, not
  # `pip`: the pip ecosystem never picked up uv.lock, so scheduled Python
  # updates silently never opened a PR — every Python bump to date (cryptography,
  # anyio, pyjwt, mako) arrived as a *security* update, which detects the package
  # manager itself and ignores this config. Same fix as mcp-hello-server #12.
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps"
